# Local / staging-style stack for BlueBird API
# Usage: docker compose up -d
# DATABASE_URL=postgresql://bluebird:bluebird@localhost:5432/bluebird?schema=public
# REDIS_URL=redis://localhost:6379

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bluebird
      POSTGRES_PASSWORD: bluebird
      POSTGRES_DB: bluebird
    ports:
      - "5432:5432"
    volumes:
      - bluebird_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bluebird_redis:/data

volumes:
  bluebird_pg:
  bluebird_redis:
